---
- name: Join master2-3 to Kubernetes control plane
  hosts: master2-3
  become: true
  gather_facts: true

  tasks:

    - name: Extract the master join command from the output
      local_action: shell sed -n 83,85p /var/tmp/kubeadm-init-output.txt > /tmp/mastertoken

    - name: Move the file into the master 2 & 3 and change the permission of the mastertoken file to make it executable
      copy:
        src: /tmp/mastertoken
        dest: /tmp/master-join-file
        owner: root
        group: root
        mode: '0777'

    - name: Insert the CRI socket in the join command
      shell: sed -i '$ s/$/\ --cri-socket\ unix:\/\/\/var\/run\/containerd\/containerd.sock/g' /tmp/master-join-file

    - name: Execute the playbook to add master 2 & 3 to the cluster
      command: sh /tmp/master-join-file

    - name: Grant the ubuntu user the permission to run kubectl commands
      shell: |
        sudo su -c 'mkdir -p $HOME/.kube' ubuntu
        sudo su -c 'sudo cp -f /etc/kubernetes/admin.conf $HOME/.kube/config' ubuntu
        sudo su -c 'sudo chown $(id -u):$(id -g) $HOME/.kube/config' ubuntu
