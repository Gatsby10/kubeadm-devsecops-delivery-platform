---
- name: Install containerd and Kubernetes components
  hosts: master1, master2-3, workers
  become: true

  vars:
    kubernetes_version_channel: "v1.35"
    docker_gpg_key_url: "https://download.docker.com/linux/ubuntu/gpg"
    kubernetes_gpg_key_url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version_channel }}/deb/Release.key"

  tasks:
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Disable swap immediately
      command: swapoff -a
      when: ansible_swaptotal_mb | int > 0
      changed_when: ansible_swaptotal_mb | int > 0

    - name: Disable swap in /etc/fstab
      replace:
        path: /etc/fstab
        regexp: '^(.*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Ensure kernel modules config file exists
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Load overlay kernel module
      community.general.modprobe:
        name: overlay
        state: present

    - name: Load br_netfilter kernel module
      community.general.modprobe:
        name: br_netfilter
        state: present

    - name: Set Kubernetes sysctl params
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: "0644"

    - name: Apply sysctl settings
      command: sysctl --system
      changed_when: false

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: "{{ docker_gpg_key_url }}"
        dest: /tmp/docker.asc
        mode: "0644"

    - name: Convert Docker GPG key to keyring
      command: gpg --dearmor -o /etc/apt/keyrings/docker.gpg /tmp/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Set Docker keyring permissions
      file:
        path: /etc/apt/keyrings/docker.gpg
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Update apt cache after adding Docker repo
      apt:
        update_cache: true

    - name: Remove Ubuntu containerd package if present
      apt:
        name: containerd
        state: absent

    - name: Install Docker containerd package
      apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory
        mode: "0755"

    - name: Generate fresh containerd config
      shell: containerd config default > /etc/containerd/config.toml
      changed_when: true

    - name: Ensure CRI plugin is not disabled
      lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins\s*='
        line: 'disabled_plugins = []'
        insertafter: '^version\s*='

    - name: Enable SystemdCgroup in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart and enable containerd after config change
      systemd:
        name: containerd
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Download Kubernetes GPG key
      get_url:
        url: "{{ kubernetes_gpg_key_url }}"
        dest: /tmp/kubernetes.asc
        mode: "0644"

    - name: Convert Kubernetes GPG key to keyring
      command: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes.asc
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version_channel }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Update apt cache after adding Kubernetes repo
      apt:
        update_cache: true

    - name: Install Kubernetes components
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Ensure kubelet is enabled
      systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Install crictl (cri-tools)
      apt:
        name: cri-tools
        state: present

    - name: Verify containerd CRI responds before kubeadm init or join
      command: crictl --runtime-endpoint unix:///var/run/containerd/containerd.sock info
      register: crictl_info
      changed_when: false

    - name: Show completion message
      debug:
        msg: "Kubernetes components installed successfully and containerd CRI is responding. Ready for kubeadm init or join."
